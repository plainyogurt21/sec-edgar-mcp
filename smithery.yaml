build:
  dockerBuildPath: .
  dockerfilePath: Dockerfile

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      userAgent:
        type: string
        description: Optional user agent string for SEC requests
        default: "Adu Subramanian (1wholepackage@gmail.com)"
  commandFunction: |-
    (config) => ({
      command: "python",
      args: ["-m", "sec_edgar_mcp.server"],
      env: {
        SEC_EDGAR_USER_AGENT: config.userAgent || "Adu Subramanian (1wholepackage@gmail.com)"
      }
    })

exampleConfig:
  userAgent: "Adu Subramanian (1wholepackage@gmail.com)"
