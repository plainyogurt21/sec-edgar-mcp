build:
  dockerBuildPath: .

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      userAgent:
        type: string
        description: Optional user agent string for SEC EDGAR API requests (defaults to edgartools default)
        default: "Adu Subramanian (1wholepackage@gmail.com)"
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: ['sec_edgar_mcp/server.py'],
      env: config.userAgent ? { 'SEC_EDGAR_USER_AGENT': config.userAgent } : {}
    })

exampleConfig:
  userAgent: "Adu Subramanian (1wholepackage@gmail.com)"
